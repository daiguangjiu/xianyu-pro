{% extends "base.html" %}
{% block title %}商家注册 · 渔货栈{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title">
    <h1>商家注册</h1>
    <span class="page-subtitle">注册后提交入驻资料，平台审核通过即可开通商家端后台</span>
  </div>
</div>

<div class="card" style="max-width: 460px; padding: var(--s-5);">
  {% if error %}
  <div class="alert alert-danger" style="margin-bottom: var(--s-4);">
    <i class="bi bi-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <form method="post" action="/self/merchant/register" autocomplete="off">
    <div class="field" style="margin-bottom: var(--s-4);">
      <label>手机号 <span class="req">*</span></label>
      <input type="text" name="phone" placeholder="用于登录，也是平台联系渠道" required autofocus>
    </div>

    <div class="field" style="margin-bottom: var(--s-4);">
      <label>联系人称呼</label>
      <input type="text" name="nickname" placeholder="如：王经理（留空则自动生成）">
    </div>

    <div class="field" style="margin-bottom: var(--s-4);">
      <label>登录密码 <span class="req">*</span></label>
      <input type="password" name="password" placeholder="至少 6 位" required>
    </div>

    <div class="field" style="margin-bottom: var(--s-4);">
      <label>确认密码 <span class="req">*</span></label>
      <input type="password" name="password2" placeholder="再输入一次密码" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">
      <i class="bi bi-person-plus"></i> 注册并进入入驻流程
    </button>
  </form>

  <div style="margin-top: var(--s-4); text-align: center; font-size: 13px; color: var(--c-text-muted);">
    已有账号？<a href="/self/merchant/login" style="color: var(--c-primary);">直接登录</a>
  </div>
</div>
{% endblock %}
