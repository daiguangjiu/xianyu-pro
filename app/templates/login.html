<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <title>登录 · {{ app_name }}</title>
  <link rel="icon" href="/static/brand/favicon.png">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form class="card login-card" method="post" action="/login">
      <div class="login-brand">
        <img src="/static/brand/logo.png" alt="{{ app_name }}" width="40" height="40">
        <div class="login-brand-text">
          <strong>{{ app_brand }}</strong>
          <span class="muted">{{ app_tagline }}</span>
        </div>
      </div>

      <h1>登录</h1>
      <p class="muted" style="margin: 0 0 12px;">
        一个账号可进渔枢系统 / 渔货栈 / 渔集，具体能进哪些由管理员在「用户管理」里授权
      </p>
      {% if error %}
        <div class="note danger" role="alert">{{ error }}</div>
      {% endif %}

      <div class="field">
        <label for="username">账号</label>
        <input id="username" type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn primary login-submit">登录</button>
      <p class="muted login-hint">请妥善保管自己的账号密码，不要外借！如有需要请联系管理员！</p>
    </form>
  </main>
</body>
</html>
