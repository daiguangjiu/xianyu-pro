# 订单消息解析规则（已按当前飞书群模板校准）
# ------------------------------------------------------------------
# 群消息模板（2026-09 现行版）：
#   产品： AirPods Pro 3 新款苹果耳机
#   收货人： 基拉
#   手机号码： 17842144173
#   地址信息： 浙江省 宁波市 北仑区 梅山街道 极氪山川生活区
#   备注： 要黑色，尽快发货
#   售价：469
#   成本价：
#   所属供应链：
#   出货闲鱼号：
#   回款支付宝归属人：
#
# 新版要点：
#   1. 新增「备注」——记录下单备注等信息（推单信息里会带出来），上行留空也请保留这一行；
#   2. 新增「所属供应链」（对应 supplier_name）；
#   3. 成本价 / 闲鱼号 / 回款人允许上行时留空，留空字段保持为空，不会串取下一行；
#   4. 群里偶尔把换行压成一串空格（地址与售价挤在一行），引擎会先按「标签:」切行，两种版式结果一致；
#   5. 旧模板（出货闲鱼号、回款支付宝归属人带值）继续兼容。
#
# 注意：群消息里没有订单号，订单号只出现在订单截图里。
#       所以这里 order_no 不是必填，而是从截图 OCR 文本中提取（ocr_patterns）。
#       截图里通常还有：买家昵称+手机号、商品名+规格、成交价、运费、订单编号。
# ------------------------------------------------------------------
# 字段配置说明：
#   labels       —— 行内 "标签: 值" 的标签别名（推荐，容错最好，支持全角/半角冒号）
#   patterns     —— 正则，第一个捕获组为值；优先于 labels；同时会用于群消息与截图文本
#   ocr_patterns —— 仅用于截图 OCR 文本的正则（截图版式与群消息不同，单独写更安全）
#   required     —— 必填，全部缺失时该消息被判为「非订单消息」并忽略
#   type         —— text | int | money | phone | datetime | address
#   解析优先级：patterns(群消息) > labels(群消息) > ocr_patterns(截图) > patterns(截图) > labels(截图)
#
# 改完可在 Web「解析规则」页粘贴真实消息 + OCR 文本即时验证，保存即生效。
# ------------------------------------------------------------------

version: 1
default_platform: xianyu

# ---------------------------------------------------------------------------
# typos：取值之前纠一遍「人工/复制粘贴常犯的错」。每条都能单独关（改成 false）。
# 说明：手机号去空格、全角金额、货币符号认错（x59）、标签两侧多余空白这些
#       引擎取值时已经内在处理了，不在这里重复配；下面只放真正需要额外纠的。
#   fullwidth_alnum  全角字母/数字转半角：商品名里的 ＡＢＣ、电话号码 １２３
#   name_spaces      人名被人换行拆开（收货人:张 / 女士），合并后不该只取到姓
# ---------------------------------------------------------------------------
typos:
  fullwidth_alnum: true
  name_spaces: true

platforms:
  - key: xianyu
    label: 闲鱼
    detect:
      any_contains:
        - 出货闲鱼号
        - 回款支付宝归属人
        - 产品：
        - 产品:
        - 闲鱼
      all_contains: []
      regex: []
    fields:
      # ---------------- 商品（同时作为「是否订单消息」的判断依据） ----------------
      - key: product_name
        label: 产品名称
        type: text
        required: true
        # 标准写法「产品名称」；「产品 / 商品 / 宝贝…」等旧写法继续兼容（模板微调也能识别）
        labels: [产品名称, 产品, 商品名称, 商品名, 商品, 宝贝, 品名, 货品, 名称]
        # 必须带冒号：群里通知常说「戴森的产品大家注意下…」，冒号可省就会把整句闲聊
        # 当成商品名、把通知误判成订单（2026-09 线上出过一次）
        patterns:
          - '产品名称[:：][ \t]*([^\n]+)'
          - '产品[:：][ \t]*([^\n]+)'
          - '商品(?:名称|名)?[:：][ \t]*([^\n]+)'
        # 截图里的商品名是完整全称，优先覆盖群消息中的简称
        ocr_override: true
        ocr_patterns:
          # 截图里商品名通常单独一行，形如 "雷鸟 32U8A Pro | 31.5英寸 ¥2599.00"
          # OCR 常把 ¥ 认成 +，结尾货币符号放宽。
          # 注意：竖线两侧的空白只能用 [ \t]（不能用 \s）—— 截图上一行地址 + 下一行
          # 以「|」开头的噪声会被跨行吃掉，把上一行地址当成商品名（2026-10-03 那单）。
          - '^([^\n¥￥]{3,40}?)[ \t]*[|｜][ \t]*[^\n¥￥]{1,20}[ \t]*[¥￥+]'
          # 更常见的版式：商品名与售价同行（"倍思Q2 20000毫安30W自带线充电宝 ¥59.00"）
          - '^([^\n¥￥]{4,60}?)[ \t]+[¥￥][ \t]*[\d,]+(?:\.\d{1,2})?'

      - key: spec
        label: 规格
        type: text
        required: false
        labels: [规格, 型号, 颜色, 版本, 套餐, 配置, 尺码]
        patterns: ['规格[:：]?[ \t]*([^\n]+)']
        ocr_patterns:
          # 排除 %：OCR 常把 "31.5英寸" 识别成 "31.53%"
          # 同 product_name：竖线两侧只认空格 / 制表符，别跨行（2026-10-03 规格被取成
          # 「KRABET, Ata?」就是把上一行地址和下一行噪声拼在了一起）
          - '^[^\n¥￥]{3,40}?[ \t]*[|｜][ \t]*([^\n¥￥%]{1,20})[ \t]*[¥￥+]'

      # ---------------- 收货信息 ----------------
      - key: receiver_name
        label: 收货人
        type: text
        required: false
        labels: [收货人, 收件人, 姓名, 联系人]
        # (?<!学员)：学员模板里有独立的「学员姓名：」，这条正则没有行首锚定，
        # 会把「学员姓名：张三」里的「姓名：张三」当成收货人取走（2026-10-11 学员模板实测）
        patterns: ['(?<!学员)(?:收货人|收件人|姓名)[:：]?[ \t]*([^\s，,;；\d]+)']

      - key: receiver_phone
        label: 手机号码
        type: phone
        required: false
        labels: [手机号码, 手机号, 电话, 联系电话, 联系方式, 手机, 电话号]
        patterns:
          - '(?:手机号码|联系电话|联系方式|联系电话|手机号|电话)[:：]?[ \t]*([0-9\-\+\s]{7,20})'
          - '\b(1[3-9]\d{9})\b'

      - key: receiver_address
        label: 地址信息
        type: address
        required: false
        labels: [地址信息, 地址, 收货地址, 收件地址, 详细地址]
        patterns:
          # 「地址信息」必须排在「地址」前面，否则会把 "信息:" 一起吃进地址
          - '(?:地址信息|收货地址|收件地址|详细地址|地址)[:：]?[ \t]*([^\n]+)'
        ocr_patterns:
          # 截图里地址是收货人下方独立一行，形如 "安徽省阜阳市临泉县高塘镇范兴集街道"
          - '^([\u4e00-\u9fa5]{2,10}(?:省|市|自治区)[^\n]{6,60})$'

      # ---------------- 金额 ----------------
      - key: sale_amount
        label: 售价
        type: money
        required: false
        labels: [售价, 金额, 订单金额, 成交价, 实付, 实付金额, 付款金额, 总价, 合计, 收款]
        patterns:
          - '(?:售价|订单金额|成交额|实付|金额)[:：]?[ \t]*[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)'
        ocr_patterns:
          # 商品行：商品名 + 售价（"倍思Q2 20000毫安30W自带线充电宝 ¥59.00"），这是截图里的售价
          - '^(?!(?:成交价|商品总价|运费|实付|账户中))[^\n¥￥]{4,60}?\s+[¥￥]\s*([\d,]+(?:\.\d{1,2})?)'
          # 兜底：成交价 / 商品总价
          - '成交价[^\d¥￥\n]{0,30}?[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)'
          # 截图里 "成交价" 四个字经常识别不出来，只能认出 "…账户中 ¥2599.00"
          - '(?:账户中|商品总价|实付)[^\d¥￥\n]*?[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)'

      - key: deal_amount
        label: 成交价
        type: money
        required: false
        labels: [成交价, 买家实付, 实付款]
        patterns: ['成交价[:：]?[ \t]*[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)']
        ocr_patterns:
          # 截图：「成交价（在支付宝担保账户中）   ¥50.00」
          # OCR 两个高频坑：① 货币符号认成 Y / x（"x200.00"）② 「交」认成「区」（"成区价"）；
          # 所以货币符号写成可省、成交价三个字放宽，取行内第一个金额
          - '成\s*[交区文]\s*价[^\n]*?([\d,]+(?:\.\d{1,2})?)'
          # 兜底：「成交价」四个字整体没认出来时，按「…（在支付宝担保账户中）」这一行取
          - '(?:账户中|担保账户)[^\n]*?([\d,]+(?:\.\d{1,2})?)'

      - key: total_amount
        label: 商品总价
        type: money
        required: false
        labels: [商品总价, 订单总额, 商品金额]
        patterns: ['(?:商品总价|订单总额)[:：]?[ \t]*[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)']
        ocr_patterns:
          # 截图：「商品总价（已优惠¥9.00）   ¥50.00」—— 必须取行内最后一个金额，
          # 否则会把括号里的「已优惠 ¥9.00」当成商品总价；货币符号同样放宽成 Y / x
          - '商品总价[^\n]*[¥￥YyXx×*]\s*([\d,]+(?:\.\d{1,2})?)'
          # 兜底：货币符号也没认出来时，取行内最后一个金额（同样是「已优惠」之后的那个）
          - '商品总价[^\n]*([\d,]+(?:\.\d{1,2})?)\s*$'

      - key: cost_amount
        label: 成本
        type: money
        required: false
        labels: [成本, 成本价, 供货价, 采购价, 进价, 结算价, 拿货价]
        # 成本常写成加法（「成本价：130➕80」= 两个供应商 / 两件货的成本）：
        # 取整段加法表达式，交给引擎按 sum: true 相加；只取第一个数会少算一半
        # （2026-10-03 那单：130 实际是 210，还要人工改一次）。
        patterns: ['(?:成本价|供货价|采购价|成本)[:：]?[ \t]*[¥￥]?[ \t]*(\d[\d,]*(?:\.\d{1,2})?(?:[ \t]*[+➕加][ \t]*[¥￥]?\d[\d,]*(?:\.\d{1,2})?)*)']
        sum: true

      - key: shipping_fee
        label: 运费
        type: money
        required: false
        labels: [运费, 快递费, 邮费]
        # 负向前瞻排除闲鱼 App 截图底部的广告位：「运费减188元」「运费立减5元」
        # 「运费省5元」「运费券」这类营销文案 —— 那不是本单运费，抓了就闹笑话。
        patterns: ['运费(?:快递费|邮费)?[:：]?[ \t]*(?!减|省|立减|直降|优惠|已减|补贴|券|返|包邮)[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)']
        ocr_patterns: ['运费(?:快递费|邮费)?[:：]?[ \t]*(?!减|省|立减|直降|优惠|已减|补贴|券|返|包邮)[^¥￥\d\n]{0,4}?[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)']

      - key: platform_fee
        label: 平台手续费
        type: money
        required: false
        labels: [手续费, 佣金, 服务费, 平台费, 扣点]
        patterns: ['(?:手续费|佣金|服务费)[:：]?[ \t]*[¥￥]?[ \t]*([\d,]+(?:\.\d{1,2})?)']

      # ---------------- 货源与资金归属 ----------------
      - key: xianyu_account
        label: 出货闲鱼号
        type: text
        required: false
        labels: [出货闲鱼号, 闲鱼号, 出货账号, 出货号, 出单闲鱼号, 卖家号]
        patterns: ['(?:出货闲鱼号|出单闲鱼号|闲鱼号|出货账号)[:：]?[ \t]*([^\n]+)']

      - key: payee_name
        label: 回款支付宝归属人
        type: text
        required: false
        # 「回款支付宝：王雨」这种短写法也要认（退单消息里常见）
        labels: [回款支付宝归属人, 回款支付宝, 支付宝归属人, 回款归属人, 回款人, 收款人, 支付宝账号, 归属人]
        patterns: ['(?:回款支付宝归属人|回款支付宝|支付宝归属人|回款归属人|回款人|收款人)[:：]?[ \t]*([^\s，,;；\n]+)']

      - key: supplier_name
        label: 供应商
        type: text
        required: false
        labels: [供应商, 所属供应链, 供应链, 供货商, 渠道, 厂家, 工厂, 货源, 发货方]
        patterns: ['(?:所属供应链|供应商|供货商|渠道|货源)[:：]?[ \t]*([^\s，,;；\n]+)']

      # ---------------- 学员信息（2026-10-11 学员模板） ----------------
      # 学员自己出的单：群里发的模板长这样（没有出货闲鱼号，售价靠截图补）
      #   产品：xxx / 收货人：xx / 手机号码：xxx / 地址信息：xxx
      #   成本价：95 / 所属供应链：BH001
      #   学员姓名： / 学员店铺名称： / 带教：
      # 这三个字段**不写进订单**（订单没有这几列），只用来在店铺档案里建档：
      # 学员店铺名称 = 店铺名（同时当这单的出货账号），学员姓名 = 账号运营人，带教 = 所属带教。
      - key: student_name
        label: 学员姓名
        type: text
        required: false
        labels: [学员姓名, 学员名字, 学员]
        patterns: ['(?:学员姓名|学员名字)[:：]?[ \t]*([^\s，,;；\n]+)']

      - key: student_shop
        label: 学员店铺名称
        type: text
        required: false
        labels: [学员店铺名称, 学员店铺名, 学员店铺]
        patterns: ['(?:学员店铺名称|学员店铺名|学员店铺)[:：]?[ \t]*([^\s，,;；\n]+)']

      - key: coach
        label: 带教
        type: text
        required: false
        labels: [带教, 带教老师, 所属带教, 带教姓名]
        patterns: ['(?:所属带教|带教老师|带教)(?:姓名)?[:：]?[ \t]*([^\s，,;；\n]+)']

      # ---------------- 其他 ----------------
      - key: order_no
        label: 订单号
        type: text
        required: false      # 群消息里没有，靠截图 OCR 补充
        # OCR 会把长数字串断成 "33169016   47870"，取值后去掉空白还原
        normalize: strip_spaces
        labels: [订单号, 订单编号, 订单ID, 单号, 交易单号, 平台单号]
        patterns:
          - '(?:订单编号|订单号)[:：]?[ \t]*([A-Za-z0-9\-_]{8,})'
        ocr_patterns:
          # 实测截图 OCR 输出：「订单编号               33169016         47870 复制」
          # 允许数字之间夹任意空白，再靠 normalize 拼回完整订单号
          - '订单编号[^0-9\n]*((?:[0-9]\s*){10,})'
          - '订单号[^0-9\n]*((?:[0-9]\s*){10,})'
          - '订单编号[:：]?[ \t]*([A-Za-z0-9]{8,})'
          - '订单号[:：]?[ \t]*([A-Za-z0-9]{8,})'
          - '\b(\d{18,20})\b'

      # ---------------- 退单登记（2026-10-06 口径） ----------------
      # 「单号」类字段必须**只认 pattern、不配 labels**：_match_field 的容错匹配允许
      # key 互为子串且长度差 ≤2，labels 里写「原订单号」会把普通订单消息里的
      # 「订单号：xxx」认成「订单号 ⊂ 原订单号」抢走 —— 实测会把一笔正常订单
      # 判成退单登记（原单号 = 订单号）而不再归档。（2026-10-06）
      - key: original_order_no
        label: 原单号
        type: text
        required: false
        normalize: strip_spaces
        labels: []
        patterns:
          - '原(?:始)?(?:订)?单(?:编号|号)[:：]?[ \t]*([A-Za-z0-9\-_]{6,})'

      - key: return_no
        label: 退单编号
        type: text
        required: false
        normalize: strip_spaces
        labels: []
        patterns:
          - '(?:退回|退货|寄回|退单)(?:快递|物流|货运)?(?:单号|编号|运单号)[:：]?[ \t]*([A-Za-z0-9\-_]{6,})'

      - key: quantity
        label: 数量
        type: int
        required: false
        default: "1"
        labels: [数量, 件数, 购买数量, 台数, 个数]
        patterns: ['数量[:：]?[ \t]*(\d+)']

      - key: buyer_nick
        label: 买家
        type: text
        required: false
        labels: [买家, 买家昵称, 买家ID, 用户, 客户, 昵称, 账号]
        # 必须写成「买家：xxx / 买家昵称：xxx」这种带冒号的显式写法才认：
        # 截图里「买家已付款，请尽快发货」「买家了昵称 老琴友的琴房」会把「已付款」「了昵称」
        # 当成昵称取回来（历史脏数据就是这么来的），宁缺勿错
        patterns: ['买家(?:昵称|ID|名|账号)?\s*[:：]\s*([^\s，,;；]+)']

      - key: ordered_at
        label: 下单时间
        type: datetime
        required: false
        labels: [下单时间, 成交时间, 付款时间, 创建时间, 订单时间, 时间]
        patterns:
          - '(?:下单时间|成交时间|付款时间)[:：]?[ \t]*([0-9]{4}[-/年][0-9]{1,2}[-/月][0-9]{1,2}[^\n]{0,12})'

      - key: note
        label: 备注
        type: text
        required: false
        labels: [备注, 留言, 买家留言, 说明]
        patterns: ['(?:备注|留言)[:：]?[ \t]*([^\n]+)']
